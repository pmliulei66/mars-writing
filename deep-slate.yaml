# 深邃墨灰主题 - 自定义版本
name: deep-slate
type: code
description: "【深邃墨灰】沉稳大气，深灰色调，专业质感"
version: "4.0"

style_info:
  mood: "沉稳大气"
  colors: "深灰色调"
  best_for: "深度思考、专业观点、商务文章"

# 沉稳配色方案
colors:
  background: "#f5f5f5"
  text: "#2d3436"
  primary: "#2c3e50"
  secondary: "#34495e"
  accent: "#7f8c8d"
  quote_background: "#e8e8e8"

# 渲染器配置 - 标题突出 + 句子换行
renderer:
  h2_icon: "◆"
  h2_icon_shadow: "0 0 14px rgba(44, 62, 80, 0.6)"
  card_background_image: "linear-gradient(rgba(44, 62, 80, 0.02) 1px, transparent 1px), linear-gradient(90deg, rgba(44, 62, 80, 0.02) 1px, transparent 1px)"
  card_background_size: "22px 22px"
  card_border: "1px solid rgba(44, 62, 80, 0.1)"
  card_shadow: "0 8px 32px rgba(45, 52, 54, 0.08), 0 0 20px rgba(44, 62, 80, 0.2)"
  card_border_radius: "16px"
  font_size: "16px"
  line_height: "1.8"
  letter_spacing: "0.3px"
  hr_style: "border: none; height: 1px; background: linear-gradient(90deg, transparent, rgba(44, 62, 80, 0.3), transparent);"
  # 自定义样式
  h1_font_size: "24px"
  h1_font_weight: "800"
  h1_border_bottom: "2px solid #2c3e50"
  h2_font_size: "20px"
  h2_border_left: "4px solid #2c3e50"
  h2_background: "rgba(44, 62, 80, 0.03)"
  h3_background: "rgba(44, 62, 80, 0.06)"
  paragraph_separator: "sentence"
