name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node-version: [20, 22, 24]

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        working-directory: skills/wechat-studio
        run: npm install --production

      - name: Verify convert script loads
        working-directory: skills/wechat-studio
        run: node -e "import('./scripts/convert.mjs').then(() => console.log('OK')).catch(e => { console.error(e); process.exit(1) })"

      - name: Verify SKILL.md exists
        run: |
          test -f skills/mars-writing/SKILL.md
          test -f skills/wechat-studio/SKILL.md
          echo "SKILL.md files present"

      - name: Verify references exist
        run: |
          test -f skills/mars-writing/references/book-list.md
          test -f skills/mars-writing/references/humanizer-zh.md
          test -f skills/mars-writing/references/writing-philosophy.md
          test -f skills/mars-writing/references/article-templates.md
          echo "All reference files present"
